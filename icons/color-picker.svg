<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Color picker droplet with spectrum -->
  <defs>
    <linearGradient id="colorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000"/>
      <stop offset="16.66%" style="stop-color:#FF8800"/>
      <stop offset="33.33%" style="stop-color:#FFFF00"/>
      <stop offset="50%" style="stop-color:#00FF00"/>
      <stop offset="66.66%" style="stop-color:#0088FF"/>
      <stop offset="83.33%" style="stop-color:#0000FF"/>
      <stop offset="100%" style="stop-color:#8800FF"/>
    </linearGradient>
  </defs>
  
  <!-- Droplet shape -->
  <path d="M24 4C24 4 12 16 12 26C12 32.627 17.373 38 24 38C30.627 38 36 32.627 36 26C36 16 24 4 24 4Z" 
        fill="url(#colorGradient)" 
        stroke="#333" 
        stroke-width="2"/>
  
  <!-- White highlight for glossy effect -->
  <ellipse cx="20" cy="18" rx="4" ry="6" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Color picker crosshair -->
  <circle cx="24" cy="26" r="2" fill="none" stroke="white" stroke-width="1.5"/>
  <line x1="22" y1="26" x2="26" y2="26" stroke="white" stroke-width="1.5"/>
  <line x1="24" y1="24" x2="24" y2="28" stroke="white" stroke-width="1.5"/>
</svg>