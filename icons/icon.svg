<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)"/>
  
  <!-- Color picker dropper -->
  <g transform="translate(64, 64)">
    <!-- Dropper body -->
    <path d="M -15,-20 L 15,-20 L 10,0 L 15,20 L 5,20 L 0,10 L -5,20 L -15,20 L -10,0 Z" 
          fill="white" opacity="0.9"/>
    <!-- Dropper tip -->
    <circle cx="0" cy="-20" r="8" fill="white"/>
    <!-- Inner drop -->
    <circle cx="0" cy="-20" r="5" fill="#FF6B6B"/>
  </g>
</svg>