<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picky - Color & Typography Picker</title>
    <link rel="stylesheet" href="popup.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="pickyApp()" 
         x-init="init()"
         class="picky-popup">
        
        <!-- Main Content -->
        <main class="picky-main">
            <!-- Color Picker Block -->
            <div class="picky-block" 
                 :class="{ 'active': activePicker === 'color' }"
                 @click="activateColorPicker()">
                <div class="block-icon">
                    <img src="icons/color-picker-24.png" alt="Color Picker" class="icon-image">
                </div>
            </div>

            <!-- Typography Block -->
            <div class="picky-block" 
                 :class="{ 'active': activePicker === 'typography' }"
                 @click="activateTypographyPicker()">
                <div class="block-icon">
                    <img src="icons/typography-picker-24.png" alt="Typography Picker" class="icon-image">
                </div>
            </div>
        </main>
    </div>

    <script src="popup.js"></script>
</body>
</html>
